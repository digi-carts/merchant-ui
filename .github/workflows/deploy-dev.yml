name: Build & Deploy (Dev)
on:
  push:
    branches: [stage]
env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/digi-carts-dev/digi-cart/digi-cart-merchant-ui
  SERVICE: digi-cart-merchant-ui-dev
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}-dev:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://digi-cart-api-gateway-dev-1029259316158.us-east1.run.app
            NEXT_PUBLIC_STOREFRONT_URL=https://digi-cart-storefront-dev-1029259316158.us-east1.run.app
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run (dev)
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}-dev:latest \
            --quiet
